[package]
name = "heart"
version = "0.0.1"
description = "Local AI companion that feels emotions"
authors = ["Mohamed 'Mavdol' Diallo"]
edition = "2021"

[lib]
name = "heart_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rustfmt = "0.10.0"
tauri-plugin-store = "2"
npc-neural-affect-matrix = "0.0.1"
lancedb = "0.22.2"
arrow = "56.2.0"
chrono = "0.4.41"
log = "0.4"
fastembed = "5.2.0"
tokio = "1"
arrow-schema = "57.0.0"
futures = "0.3.31"
reqwest = "0.12.24"
uuid = { version = "1", features = ["v4", "serde"] }
tauri-plugin-os = "2"
tauri-plugin-process = "2"


[dev-dependencies]
rustfmt = "0.10.0"
tokio = { version = "1", features = ["rt", "macros"] }
